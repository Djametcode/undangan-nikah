<script>
let cfg = null;
const $ = (id) => document.getElementById(id);

function toast(msg, err) {
  const el = err ? $("toastErr") : $("toast");
  el.textContent = msg;
  el.classList.remove("hidden");
  setTimeout(() => el.classList.add("hidden"), 3000);
}

async function api(url, opts = {}) {
  const r = await fetch(url, { ...opts, headers: { "Content-Type": "application/json", ...(opts.headers || {}) } });
  if (r.status === 401) { location.reload(); throw new Error("Unauthorized"); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || "Error");
  return j;
}

async function login() {
  try {
    await api("/api/login", { method: "POST", body: JSON.stringify({ password: $("pw").value }) });
    boot();
  } catch {
    $("loginErr").style.display = "block";
  }
}
$("pw").addEventListener("keydown", (e) => { if (e.key === "Enter") login(); });

async function logout() {
  await fetch("/api/logout", { method: "POST" }).catch(() => {});
  location.reload();
}

/* ---------- Path helpers ---------- */
function setPath(obj, path, val) {
  const parts = path.split(".");
  let o = obj;
  for (let i = 0; i < parts.length - 1; i++) {
    if (o[parts[i]] === undefined) o[parts[i]] = {};
    o = o[parts[i]];
  }
  o[parts[parts.length - 1]] = val;
}
function getPath(obj, path) {
  return path.split(".").reduce((o, k) => (o ? o[k] : undefined), obj);
}

function esc(s) { return String(s ?? "").replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;"); }

/* ---------- Field builders (return HTML strings) ---------- */
function F(name, label, textarea) {
  const val = getPath(cfg, name) ?? "";
  if (textarea) {
    return `<label class="label">${label}</label><textarea data-path="${name}" class="field mb-3" rows="2">${esc(val)}</textarea>`;
  }
  return `<label class="label">${label}</label><input data-path="${name}" value="${esc(val)}" class="field mb-3" />`;
}

function C(name, label) {
  const val = getPath(cfg, name) ?? "#000000";
  return `<div class="mb-3" data-color-group="${name}">
    <label class="label">${label}</label>
    <div class="flex items-center gap-2">
      <input type="color" data-path="${name}" value="${esc(val)}" class="w-10 h-10 rounded-lg border border-[#e7d8d3] cursor-pointer color-picker" oninput="syncColor(this)" />
      <input data-path="${name}" value="${esc(val)}" class="field flex-1 color-text" oninput="syncColor(this)" />
    </div>
  </div>`;
}

function syncColor(el) {
  const grp = el.closest("[data-color-group]");
  if (!grp) return;
  const picker = grp.querySelector(".color-picker");
  const text = grp.querySelector(".color-text");
  if (!picker || !text) return;
  if (el === picker) {
    text.value = picker.value;
    // update cfg langsung biar preview live ikut
    setPath(cfg, el.dataset.path, picker.value);
  } else {
    let v = text.value.trim();
    if (!v.startsWith("#")) v = "#" + v;
    if (/^#[0-9a-fA-F]{6}$/.test(v)) {
      picker.value = v;
      setPath(cfg, el.dataset.path, v);
    }
  }
}

function T(name, label) {
  return `<label class="flex items-center gap-2 py-2 cursor-pointer">
    <input type="checkbox" data-path="${name}" class="w-4 h-4 accent-[#9a3412]" /> ${label}
  </label>`;
}

function UploadField(name, label) {
  const url = getPath(cfg, name) || "";
  return `<div class="border border-[#e7d8d3] rounded-xl p-4 text-center bg-[#fffbeb]">
    <p class="text-xs text-slate-500 mb-3">${label}</p>
    ${url ? `<img src="${esc(url)}" class="thumb mx-auto mb-3" />` : '<div class="thumb mx-auto mb-3 bg-[#f7f0e3] border border-dashed border-terra/30 flex items-center justify-center text-2xl text-slate-400">+</div>'}
    <button onclick="pickUpload('${name}')" class="w-full text-xs border border-terra/40 text-terra py-2 rounded-lg cursor-pointer">${url ? "Ganti" : "Upload"}</button>
  </div>`;
}

  cfg.media = cfg.media || {};

  cfg.media.videoEnabled = true;
  renderAll("tab-media");
  toast("Video cover: " + name + ". Klik Simpan & Deploy.");
}
function useVendorSectionVideo(name, section) {
  cfg.sectionVideos = cfg.sectionVideos || {};

  cfg.sectionVideos[section].enabled = true;
  renderAll("tab-media");
  toast("Video section " + section + ": " + name + ". Klik Simpan & Deploy.");

function applyPreset(name) {
  const p = PRESETS[name];
  if (!p) return;
  // set cfg.theme langsung (deep merge 2 level: theme + theme.motion) — sand ikut ter-set
  cfg.theme = { ...cfg.theme, ...p, motion: { ...(cfg.theme.motion || {}), ...p.motion } };
  // preset dengan video hiasan → otomatis pasang video cover
  if (p.video) {
    cfg.media = cfg.media || {};
    cfg.media.video = "/uploads/vendor/videos/" + p.video;
    cfg.media.videoEnabled = true;
  }
  renderAll("tab-theme");
  toast("Preset '" + p.name + "' diterapkan. Klik Simpan & Deploy untuk menyimpan.");
}

/* ---------- Render all panels ---------- */
function renderAll(activeTab) {
  $("main").innerHTML = `
    <section id="tab-couple" class="tab-panel hidden">${renderCouple()}</section>
    <section id="tab-event" class="tab-panel hidden">${renderEvent()}</section>
    <section id="tab-photos" class="tab-panel hidden">${renderPhotos()}</section>
    <section id="tab-media" class="tab-panel hidden">${renderMedia()}</section>
    <section id="tab-text" class="tab-panel hidden">${renderText()}</section>
    <section id="tab-label" class="tab-panel hidden">${renderLabel()}</section>
    <section id="tab-section" class="tab-panel hidden">${renderSection()}</section>
    <section id="tab-gift" class="tab-panel hidden">${renderGift()}</section>
    <section id="tab-rsvp" class="tab-panel hidden">${renderRsvp()}</section>
    <section id="tab-theme" class="tab-panel hidden">${renderTheme()}</section>
    <section id="tab-settings" class="tab-panel hidden">${renderSettings()}</section>
  `;
  // event listeners
  document.querySelectorAll(".tab-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".tab-btn").forEach((b) => b.classList.remove("tab-active"));
      document.querySelectorAll(".tab-panel").forEach((p) => p.classList.add("hidden"));
      btn.classList.add("tab-active");
      $(btn.dataset.tab).classList.remove("hidden");
    });
  });
  // media upload listeners
  const uv = $("upload-video");
  if (uv) uv.addEventListener("change", (e) => {
    uploadFile(e.target.files[0], (url) => { setPath(cfg, "media.video", url); $("videoInfo").textContent = url; });
  });
  const um = $("upload-music");
  if (um) um.addEventListener("change", (e) => {
    uploadFile(e.target.files[0], (url) => { setPath(cfg, "media.music", url); $("musicInfo").textContent = url; });
  });
  // sync values from cfg
  document.querySelectorAll("[data-path]").forEach((el) => {
    if (el.type === "checkbox") el.checked = !!getPath(cfg, el.dataset.path);
    else if (el.type === "color") el.value = getPath(cfg, el.dataset.path) ?? "#000000";
    else el.value = getPath(cfg, el.dataset.path) ?? "";
  });
  const ra = $("theme.revealAnim");
  if (ra) ra.value = getPath(cfg, "theme.revealAnim") || "fadeUp";
  const gl = $("theme.galleryLayout");
  if (gl) gl.value = getPath(cfg, "theme.galleryLayout") || "carousel";
  const pl = $("theme.motion.parallaxLevel");
  if (pl) pl.value = getPath(cfg, "theme.motion.parallaxLevel") || "medium";
  const vc = $("theme.motion.videoCoverMode");
  if (vc) vc.value = getPath(cfg, "theme.motion.videoCoverMode") || "cover";
  const fs = $("theme.fontScript");
  if (fs) fs.value = getPath(cfg, "theme.fontScript") || "Great Vibes, cursive";
  const fse = $("theme.fontSerif");
  if (fse) fse.value = getPath(cfg, "theme.fontSerif") || "Cormorant Infant, Georgia, serif";
  const fsa = $("theme.fontSans");
  if (fsa) fsa.value = getPath(cfg, "theme.fontSans") || "Outfit, system-ui, sans-serif";
  const vop = $("videoOpacityVal");
  if (vop) vop.textContent = "Nilai: " + (getPath(cfg, "theme.videoOpacity") || "70") + "%";
  const bop = $("bgOpacityVal");
  if (bop) bop.textContent = "Nilai: " + (getPath(cfg, "theme.bgOpacity") || "100") + "%";
  // range input listeners
  document.querySelectorAll('input[type="range"][data-path]').forEach((el) => {
    el.addEventListener("input", () => {
      if (el.dataset.path === "theme.videoOpacity") { const t = $("videoOpacityVal"); if (t) t.textContent = "Nilai: " + el.value + "%"; }
      if (el.dataset.path === "theme.bgOpacity") { const t = $("bgOpacityVal"); if (t) t.textContent = "Nilai: " + el.value + "%"; }
    });
  });
  // activate tab (default pertama; bisa diarahkan via argumen, e.g. renderAll("tab-theme"))
  document.querySelectorAll(".tab-panel").forEach((p) => p.classList.add("hidden"));
  const targetTab = activeTab || "tab-couple";
  document.querySelectorAll(".tab-btn").forEach((b) => b.classList.toggle("tab-active", b.dataset.tab === targetTab));
  $(targetTab).classList.remove("hidden");
  renderGalleryList();
  renderFileList();
  $("videoInfo").textContent = getPath(cfg, "media.video") || "Belum ada video";
  $("musicInfo").textContent = getPath(cfg, "media.music") || "Belum ada musik";
}

/* ---------- Gallery ---------- */
function renderGalleryList() {
  const el = $("galleryList");
  if (!el) return;
  const imgs = getPath(cfg, "photos.gallery") || [];
  el.innerHTML = imgs.map((u, i) => `
    <div class="border border-[#e7d8d3] rounded-xl p-3 bg-[#fffbeb]">
      <img src="${esc(u)}" class="w-full h-32 object-cover rounded-lg mb-2" />
      <div class="flex gap-2">
        <button onclick="pickGallery(${i})" class="flex-1 text-xs border border-terra/40 text-terra py-1.5 rounded-lg cursor-pointer">Ganti</button>
        <button onclick="removeGallery(${i})" class="flex-1 text-xs border border-red-400/40 text-red-600 py-1.5 rounded-lg cursor-pointer">Hapus</button>
      </div>
    </div>`).join("") || '<p class="text-xs text-slate-400 col-span-3">Belum ada foto galeri.</p>';
}
function addGallery() {
  const input = document.createElement("input");
  input.type = "file"; input.accept = "image/*"; input.className = "hidden";
  document.body.appendChild(input);
  input.onchange = () => uploadFile(input.files[0], (url) => {
    const arr = getPath(cfg, "photos.gallery") || [];
    arr.push(url);
    setPath(cfg, "photos.gallery", arr);
    renderGalleryList();
  });
  input.click();
}
function pickGallery(i) {
  const input = document.createElement("input");
  input.type = "file"; input.accept = "image/*"; input.className = "hidden";
  document.body.appendChild(input);
  input.onchange = () => uploadFile(input.files[0], (url) => {
    const arr = getPath(cfg, "photos.gallery");
    arr[i] = url;
    setPath(cfg, "photos.gallery", arr);
    renderGalleryList();
  });
  input.click();
}
function removeGallery(i) {
  const arr = getPath(cfg, "photos.gallery");
  arr.splice(i, 1);
  setPath(cfg, "photos.gallery", arr);
  renderGalleryList();
}

/* ---------- Uploads ---------- */
async function uploadFile(file, cb) {
  if (!file) return;
  const fd = new FormData();
  fd.append("file", file);
  const r = await fetch("/api/upload", { method: "POST", body: fd });
  if (r.status === 401) { location.reload(); return; }
  const j = await r.json();
  if (!r.ok) { toast(j.error || "Upload gagal", true); return; }
  cb(j.url);
  toast("Upload sukses");
  renderFileList();
}
function pickUpload(field) {
  const input = document.createElement("input");
  input.type = "file"; input.accept = "image/*"; input.className = "hidden";
  document.body.appendChild(input);
  input.onchange = () => uploadFile(input.files[0], (url) => {
    setPath(cfg, field, url);
    renderAll();
  });
  input.click();
}

async function renderFileList() {
  const el = $("fileList");
  if (!el) return;
  try {
    const files = await api("/api/files");
    el.innerHTML = files.map((f) => `
      <div class="flex items-center gap-2 bg-[#fffbeb] border border-[#e7d8d3] rounded-lg px-3 py-2 text-xs">
        <span class="text-slate-500">${esc(f.name)}</span>
        <button onclick="delFile('${esc(f.name)}')" class="text-red-600 hover:text-red-500 cursor-pointer">Hapus</button>
      </div>`).join("") || '<span class="text-xs text-slate-400">Kosong</span>';
  } catch {}
}
async function delFile(name) {
  await fetch("/api/upload/" + encodeURIComponent(name), { method: "DELETE" }).catch(() => {});
  renderFileList();
}

/* ---------- Save ---------- */
async function saveAll() {
  try {
    document.querySelectorAll("[data-path]").forEach((el) => {
      // Color picker + text input share data-path. Text input = source of truth (user edit di situ,
      // picker auto-sync via syncColor). Skip color picker biar gak nimpain nilai lama.
      if (el.type === "color") return;
      if (el.type === "checkbox") setPath(cfg, el.dataset.path, el.checked);
      else setPath(cfg, el.dataset.path, el.value);
    });
    const ra = $("theme.revealAnim");
    if (ra) setPath(cfg, "theme.revealAnim", ra.value);
    const gl = $("theme.galleryLayout");
    if (gl) setPath(cfg, "theme.galleryLayout", gl.value);
    const pl = $("theme.motion.parallaxLevel");
    if (pl) setPath(cfg, "theme.motion.parallaxLevel", pl.value);
    const vc = $("theme.motion.videoCoverMode");
    if (vc) setPath(cfg, "theme.motion.videoCoverMode", vc.value);
    const fs = $("theme.fontScript");
    if (fs) setPath(cfg, "theme.fontScript", fs.value);
    const fse = $("theme.fontSerif");
    if (fse) setPath(cfg, "theme.fontSerif", fse.value);
    const fsa = $("theme.fontSans");
    if (fsa) setPath(cfg, "theme.fontSans", fsa.value);
    await api("/api/config", { method: "POST", body: JSON.stringify(cfg) });
    toast("Undangan tersimpan & deployed!");
  } catch (e) {
    toast(e.message, true);
  }
}

async function changePw() {
  try {
    await api("/api/password", { method: "POST", body: JSON.stringify({ current: $("oldPw").value, next: $("newPw").value }) });
    $("oldPw").value = ""; $("newPw").value = "";
    toast("Password diganti");
  } catch (e) { toast(e.message, true); }
}

/* ---------- Boot ---------- */
async function boot() {
  $("login").style.display = "none";
  $("app").style.display = "block";
  try {
    cfg = await api("/api/config");
  } catch {
    cfg = {};
  }
  renderAll();
}
</script>
